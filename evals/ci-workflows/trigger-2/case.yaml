schema_version: "1.1"
name: ci-workflows-trigger-2
description: Should load ci-workflows.
tags: [ci-workflows, trigger]
runs: 1
execution:
  max_turns: 2
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: "Move the heavy integration suite off pull requests and into a nightly scheduled run."
graders:
  - name: loaded-ci-workflows
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ci-workflows"'
