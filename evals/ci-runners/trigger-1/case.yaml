schema_version: "1.1"
name: ci-runners-trigger-1
description: Should load ci-runners.
tags: [ci-runners, trigger]
runs: 1
execution:
  max_turns: 2
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: "Our GitHub Actions bill doubled this month. Where is it going, and how do we cut it?"
graders:
  - name: loaded-ci-runners
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ci-runners"'
