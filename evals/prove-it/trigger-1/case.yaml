schema_version: "1.1"
name: prove-it-trigger-1
description: Should load prove-it.
tags: [prove-it, trigger]
runs: 1
execution:
  max_turns: 2
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: "Pip claims the new runner made builds 30% faster. Here are two runs of each. Does that hold up?"
graders:
  - name: loaded-prove-it
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?prove-it"'
