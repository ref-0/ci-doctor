schema_version: "1.1"
name: ci-doctor-trigger-1
description: Should load ci-doctor.
tags: [ci-doctor, trigger]
runs: 1
execution:
  max_turns: 2
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: "Our GitHub Actions pipeline takes 40 minutes per PR and the bill keeps climbing. Put together a plan to bring both down."
graders:
  - name: loaded-ci-doctor
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ci-doctor"'
