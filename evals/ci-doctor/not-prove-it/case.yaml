schema_version: "1.1"
name: ci-doctor-not-prove-it
description: Belongs to prove-it, so should not load ci-doctor.
tags: [ci-doctor, not-trigger]
runs: 1
execution:
  max_turns: 2
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: "Mo says the new cache cut the build from 9 to 6 minutes, from two runs. Is that good enough to put in the release notes?"
graders:
  - name: did-not-load-ci-doctor
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ci-doctor"'
    min: 0
    max: 0
    arm: both
