schema_version: "1.1"
name: ci-doctor-trigger-2
description: Should load ci-doctor.
tags: [ci-doctor, trigger]
runs: 1
execution:
  max_turns: 2
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: "The build-and-test check on PR 212 went red and I can't tell why. What happened, and what should Pip do next?"
graders:
  - name: loaded-ci-doctor
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ci-doctor"'
