schema_version: "1.1"
name: review-gate-not-ci-merge-workflow
description: Belongs to ci-merge-workflow, so should not load review-gate.
tags: [review-gate, not-trigger]
runs: 1
execution:
  max_turns: 2
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: "The PR's approved. Merge it and check the deploy."
graders:
  - name: did-not-load-review-gate
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?review-gate"'
    min: 0
    max: 0
    arm: both
