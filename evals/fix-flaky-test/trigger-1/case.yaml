schema_version: "1.1"
name: fix-flaky-test-trigger-1
description: Should load fix-flaky-test.
tags: [fix-flaky-test, trigger]
runs: 1
execution:
  max_turns: 2
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: "user_sessions.test.ts fails randomly in CI but never on my machine."
graders:
  - name: loaded-fix-flaky-test
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?fix-flaky-test"'
