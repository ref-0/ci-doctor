schema_version: "1.1"
name: fix-flaky-test-trigger-3
description: Should load fix-flaky-test.
tags: [fix-flaky-test, trigger]
runs: 1
execution:
  max_turns: 2
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: "This test is intermittent: it passes alone and fails when the whole suite runs in parallel."
graders:
  - name: loaded-fix-flaky-test
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?fix-flaky-test"'
