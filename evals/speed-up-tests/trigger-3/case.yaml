schema_version: "1.1"
name: speed-up-tests-trigger-3
description: Should load speed-up-tests.
tags: [speed-up-tests, trigger]
runs: 1
execution:
  max_turns: 2
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: "Tests keep hitting the 5 minute timeout in CI. Speed them up without dropping coverage."
graders:
  - name: loaded-speed-up-tests
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?speed-up-tests"'
