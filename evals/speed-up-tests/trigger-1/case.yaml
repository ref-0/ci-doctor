schema_version: "1.1"
name: speed-up-tests-trigger-1
description: Should load speed-up-tests.
tags: [speed-up-tests, trigger]
runs: 1
execution:
  max_turns: 2
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: "Our test suite takes 25 minutes locally. Which files are the slowest, and how do we cut them down?"
graders:
  - name: loaded-speed-up-tests
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?speed-up-tests"'
