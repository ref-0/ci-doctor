schema_version: "1.1"
name: agent-knowledge-trigger-2
description: Should load agent-knowledge.
tags: [agent-knowledge, trigger]
runs: 1
execution:
  max_turns: 2
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: "CLAUDE.md says to run npm test, but we moved to pnpm months ago and the skills disagree too. Clean this up."
graders:
  - name: loaded-agent-knowledge
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?agent-knowledge"'
