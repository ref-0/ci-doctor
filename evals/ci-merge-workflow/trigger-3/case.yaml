schema_version: "1.1"
name: ci-merge-workflow-trigger-3
description: Should load ci-merge-workflow.
tags: [ci-merge-workflow, trigger]
runs: 1
execution:
  max_turns: 2
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: "Pip's branch is done; take it through the merge and cut the release."
graders:
  - name: loaded-ci-merge-workflow
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ci-merge-workflow"'
