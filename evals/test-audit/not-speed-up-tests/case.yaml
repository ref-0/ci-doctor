schema_version: "1.1"
name: test-audit-not-speed-up-tests
description: Belongs to speed-up-tests, so should not load test-audit.
tags: [test-audit, not-trigger]
runs: 1
execution:
  max_turns: 2
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: "The tests in the search package are slow, about 30 seconds per file. Speed them up."
graders:
  - name: did-not-load-test-audit
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?test-audit"'
    min: 0
    max: 0
    arm: both
