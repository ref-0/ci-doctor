schema_version: "1.1"
name: test-audit-trigger-1
description: Should load test-audit.
tags: [test-audit, trigger]
runs: 1
execution:
  max_turns: 2
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: "I just wrote these tests for the billing module. Are they actually testing anything useful?"
graders:
  - name: loaded-test-audit
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?test-audit"'
