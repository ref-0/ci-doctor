schema_version: "1.1"
name: test-audit-not-proof-tiers
description: Belongs to proof-tiers, so should not load test-audit.
tags: [test-audit, not-trigger]
runs: 1
execution:
  max_turns: 2
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: "Write a property test for our URL parser, and decide whether it runs on every PR or nightly."
graders:
  - name: did-not-load-test-audit
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?test-audit"'
    min: 0
    max: 0
    arm: both
