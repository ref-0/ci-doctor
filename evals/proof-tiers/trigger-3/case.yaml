schema_version: "1.1"
name: proof-tiers-trigger-3
description: Should load proof-tiers.
tags: [proof-tiers, trigger]
runs: 1
execution:
  max_turns: 2
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: "The nightly model check of our job queue started failing after Mo's refactor. What do I do?"
graders:
  - name: loaded-proof-tiers
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?proof-tiers"'
