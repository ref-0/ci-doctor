schema_version: "1.1"
name: optimize-graphs-trigger-2
description: Should load optimize-graphs.
tags: [optimize-graphs, trigger]
runs: 1
execution:
  max_turns: 2
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: "Should I add a barrel index.ts that re-exports everything from this package?"
graders:
  - name: loaded-optimize-graphs
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?optimize-graphs"'
