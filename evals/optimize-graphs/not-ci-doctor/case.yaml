schema_version: "1.1"
name: optimize-graphs-not-ci-doctor
description: Belongs to ci-doctor, so should not load optimize-graphs.
tags: [optimize-graphs, not-trigger]
runs: 1
execution:
  max_turns: 2
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: "Give me a full plan to make our CI cheaper."
graders:
  - name: did-not-load-optimize-graphs
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?optimize-graphs"'
    min: 0
    max: 0
    arm: both
