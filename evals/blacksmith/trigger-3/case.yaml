schema_version: "1.1"
name: blacksmith-trigger-3
description: Should load blacksmith.
tags: [blacksmith, trigger]
runs: 1
execution:
  max_turns: 2
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: "Our Blacksmith invoice went up. Break down what we're paying for."
graders:
  - name: loaded-blacksmith
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?blacksmith"'
