schema_version: "1.1"
name: blacksmith-not-ci-runners
description: Belongs to ci-runners, so should not load blacksmith.
tags: [blacksmith, not-trigger]
runs: 1
execution:
  max_turns: 2
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: "Compare what self-hosted runners would cost us against GitHub-hosted ones."
graders:
  - name: did-not-load-blacksmith
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?blacksmith"'
    min: 0
    max: 0
    arm: both
