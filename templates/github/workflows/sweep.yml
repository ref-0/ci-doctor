# Starts main's daily sweep, and main's integration-test slots between sweeps, in ci.yml.
#
# Runs on GitHub Actions (2 vCPU Blacksmith), from two crons and from every merge to main.
# Reference implementation from a production monorepo; adapt to your repo. Why: docs/README.md
# section 5.
#
# How often to sweep is the user's cost and risk decision, recorded as a cron in .agents/repo/ci.md's
# "Sweep cadence": the ci-workflows skill's tiers ("Choosing the sweep's cadence") price schedules
# from this repo's merges and a sweep's cost with sweep-cadence.ts, which reads SWEEP_CRON below for
# the slots' time of day. There's no trigger by merge count, on purpose: a schedule's cost and the
# merges it can hide are what the user chooses between. Any cron works here, weekly or every 2 days
# too: both jobs find the newest slot with scripts/sweeps/cron.ts, which reads all five fields as
# sweep-cadence.ts prices them.
#
# The slots: the times here are illustrative. Each cron appears in three coupled places, since
# GitHub takes no expression in a cron or in a job's `if:`. Change them together:
#   1. the two crons under `on.schedule`;
#   2. the server cron's exact string in both jobs' `if:`;
#   3. SWEEP_CRON and SERVER_CRON under `env`, which the steps find the newest slot from.
# A renamed run title (ci.yml's run-name) also has to change in both steps' `select`.
#
# Pushes don't each start a sweep. The `push` trigger is the fallback for a late or missing cron: a
# merge starts a sweep only when none has started since the newest slot. On a new install, or after
# a slot whose cron never ran, the first merge starts one; the merges after it find that run and
# start nothing until the next slot. It can start CI on a merge, so approve it separately, or delete
# it to rely on the cron alone.
#
# With one daily suite and no server slots: delete the second cron, SERVER_CRON and the `server` job.
#
# The sweep is also the only refresh of the shard times, the one run that times every file. Pick
# its cadence on cost and risk alone: measured, times a week old split shards about as evenly as
# fresh ones (the ci-runners skill's shards, "Keeping the times current").
#
# The daily sweep is the release's check: release publishes only what a passing sweep checked.
# Pick its slot from your merge timing, the quietest few hours before your release, so the day's
# run is done before the day's release. A schedule longer than the release's makes a release wait.
#
# Cron is not a scheduler you can trust: GitHub's scheduled runs arrived hours late, and in one
# period most never started. So the first merge after each slot checks whether a run has started
# since that slot, and dispatches one if not. Either starts it once a slot; a sweep with nothing
# new since the last passing one runs only its plan. Serialized controller groups prevent
# duplicates when merges land close together.
#
# Between sweeps, a second cron starts the integration-heavy package's tests alone, so with the
# sweep's slot they run every 6 hours: a miss by a PR's near selection shows within hours, not up to
# a day, and their passes replay from the task cache on a PR that runs everything. Each runs only
# when the merges since the last pass reach the package. An unchanged slot pays only for its
# dispatch, plan and result. An unchanged daily sweep runs only its plan, and the Rust checks when
# the pass PRs skip them by is about to age out.
#
# Check the schedule itself: a dispatch isn't a pass. Schedule a one-off check at a new job's first
# run time, and read its result.
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 2 * * *'
    - cron: '41 8,14,20 * * *'

# The crons above, UTC, character for character.
env:
  SWEEP_CRON: '41 2 * * *'
  SERVER_CRON: '41 8,14,20 * * *'

# The run's own token may start a workflow_dispatch, unlike its other events. Contents: to check out
# the slot helper.
permissions:
  actions: write
  contents: read

jobs:
  start:
    name: Start main's sweep
    if: github.event.schedule != '41 8,14,20 * * *'
    # Merges close together take turns, so the second finds the sweep the first started.
    concurrency:
      group: sweep-start
      cancel-in-progress: false
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 3
    steps:
      # Only the slot helper, run on Node 24 with nothing installed.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/sweeps/cron.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      # A sweep's name, as ci.yml's run-name gives it on main, whoever started it.
      - name: Start it, unless one started since the newest slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          slot=$(node scripts/sweeps/cron.ts newest "$SWEEP_CRON")
          # Only runs started by hand; --paginate reads every page since the slot.
          started=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=workflow_dispatch&created=%3E%3D$slot&per_page=100" \
            --jq '.workflow_runs[] | select(.display_title | startswith("CI on main, ")) | .id' | wc -l)
          if [ "$started" -gt 0 ]; then
            echo "::notice::A sweep started on main since $slot, so the next one checks this merge."
            exit 0
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main -f sweep=true

  # Its plan, in ci.yml, runs nothing when the package's tests have nothing new to check.
  server:
    name: Start main's server tests
    if: github.event_name == 'push' || github.event.schedule == '41 8,14,20 * * *'
    concurrency:
      group: server-sweep-start
      cancel-in-progress: false
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 3
    steps:
      # Only the slot helper, run on Node 24 with nothing installed.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/sweeps/cron.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      # The newer of the two crons' newest slots: the sweep's, which `start` keeps and whose sweep
      # runs these tests too, or the server cron's. A run of either name since it counts.
      - name: Start them, unless they started since the slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sweep=$(node scripts/sweeps/cron.ts newest "$SWEEP_CRON")
          slot=$(node scripts/sweeps/cron.ts newest "$SERVER_CRON")
          if [[ ! $slot > $sweep ]]; then
            echo "::notice::The newest slot, $sweep, is the sweep's, which runs these tests."
            exit 0
          fi
          started=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=workflow_dispatch&created=%3E%3D$slot&per_page=100" \
            --jq '.workflow_runs[] | select(.display_title == "Server tests on main" or (.display_title | startswith("CI on main, "))) | .id' | wc -l)
          if [ "$started" -gt 0 ]; then
            echo "::notice::Main's server tests started since $slot, so the next slot checks this merge."
            exit 0
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main -f server_sweep=true
